name: publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # required to publish docs to gh pages
  id-token: write # required to publish using trusted publishing

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: publish-npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: 26.3.0
          package-manager-cache: false

      - name: Validate tag matches package.json
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          PKG_VERSION=v$(jq -r .version projects/ng-qrcode/package.json)

          echo "Git tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Git tag does not match package.json version"
            exit 1
          fi

      - run: pnpm ci

      - run: pnpm run build-for-publish

      - name: Publish to npm
        working-directory: ./dist/ng-qrcode
        run: |
          pnpm stage publish

      - name: Publish documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
          pnpm run publish:gh-pages
